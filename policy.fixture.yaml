# Test fixture only. Authorizes v1 dry-run simulation of comments/close.
# Operator default remains policy.example.yaml (mutations off).
version: 2
defaults:
  never_release: true
  never_leak_private_to_public: true
  session_kinds: [review, run, scheduled]
  egress: trusted
  review: true
  comments: false
  comment: false
  close: false
  implement: false
  land: false
  repair: ""
  protected_labels: [rusui:hold, security]
  max_reviews_per_repo_per_utc_day: 50
  max_repairs_per_repo_per_utc_day: 1
projects:
  test:
    repos:
      example/test-repo:
        visibility: public
        review: true
        comments: true
        comment: false
        close: true
        implement: false
        land: false
